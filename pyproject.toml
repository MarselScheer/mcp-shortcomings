[project]
name = "mcp-shortcomings"
version = "0.0.1"
description = "MCP server to maintain features and shortcomings of a project"
readme = "README.org"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ty>=0.0.19",
]

[tool.ty.src]
include = ["src"]

